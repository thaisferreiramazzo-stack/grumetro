<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GRUMETRO.COM.BR | Domínio à venda</title>
  <meta name="description" content="O domínio GRUMETRO.COM.BR está disponível para venda. Entre em contato para fazer uma proposta.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f1eb;
      color: #17252a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(0, 117, 110, .08);
      top: -250px;
      right: -130px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(0, 117, 110, .05);
      bottom: -220px;
      left: -100px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .icon {
      font-size: 32px;
      margin-bottom: 18px;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(23,37,42,.18);
      border-radius: 50px;
      padding: 9px 18px;
      margin-bottom: 35px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00756e;
    }

    h1 {
      font-size: clamp(42px, 9vw, 88px);
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    .metro {
      color: #00756e;
    }

    h2 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 400;
      margin-bottom: 25px;
    }

    p {
      max-width: 680px;
      margin: 0 auto 38px;
      color: #53676b;
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 17px 32px;
      background: #00756e;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      transition: .25s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #00968c;
    }

    .footer {
      margin-top: 55px;
      color: #879597;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">◆</div>

    <div class="tag">Domínio disponível</div>

    <h1>GRU<span class="metro">METRO</span></h1>

    <h2>Este domínio está à venda.</h2>

    <p>
      Um domínio direto e memorável para projetos relacionados a
      Guarulhos, mobilidade urbana, transporte, infraestrutura,
      informação e conexão metropolitana.
    </p>

    <a class="button"
       href="mailto:vanda@vanda.com.br?subject=Interesse%20no%20dom%C3%ADnio%20GRUMETRO.COM.BR">
      TENHO INTERESSE NESTE DOMÍNIO
    </a>

    <div class="footer">
      GRUMETRO.COM.BR
    </div>

  </main>

</body>
</html>
